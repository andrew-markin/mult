<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" sizes="any" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- Paint the blank page and system bars dark right away, no white flash on launch -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#37474f" />
    <!-- iOS shows launch screens (see plugins/ios-splash-screens.js) only for web apps -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Mult</title>
    <style>
      html {
        /* No zooming, scrolling, or overscroll bounce: the app fits the screen */
        touch-action: none;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background-color: #37474f;
        /* No text selection or long press callout, Safari still needs prefixes */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Quasar forces left to right, let the dir set for the language (see i18n.js) apply */
      html[dir='rtl'],
      html[dir='rtl'] body {
        direction: rtl;
      }
      /* Keep the app hidden until its fonts are loaded, see main.js, then fade it in */
      #app {
        transition: opacity 0.4s ease-out;
      }
      #app:not(.ready) {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #app {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
