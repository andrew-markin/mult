<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" sizes="any" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mult</title>
    <style>
      html {
        /* No zooming, scrolling, or overscroll bounce: the app fits the screen */
        touch-action: none;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background-color: #37474f;
        /* No text selection or long press callout, Safari still needs prefixes */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Keep the app hidden until its fonts are loaded, see main.js */
      #app:not(.ready) {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
